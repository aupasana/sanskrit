---
layout: default
---
<article class="mb-4">
  <h1>{{ page.title }}</h1>

  {% if page.youtube_id %}
  <p class="mb-3">{% include youtube_link.html youtube_id=page.youtube_id title=page.title start=page.youtube_start %}</p>
  {% endif %}

  {{ content }}

  {% if page.exercise %}
  <p><a class="btn btn-primary" href="{{ page.exercise | relative_url }}" target="_blank">Download exercise (PDF)</a></p>
  {% endif %}
</article>
