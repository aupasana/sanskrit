---
layout: default
---
<article class="mb-4">
  <h1>{{ page.title }}</h1>

  {% if page.youtube_id %}
  <div class="ratio ratio-16x9 mb-3">
    <iframe src="https://www.youtube.com/embed/{{ page.youtube_id }}" title="{{ page.title }}" allowfullscreen></iframe>
  </div>
  {% endif %}

  {{ content }}

  {% if page.exercise %}
  <p><a class="btn btn-primary" href="{{ page.exercise | relative_url }}" target="_blank">Download exercise (PDF)</a></p>
  {% endif %}
</article>
